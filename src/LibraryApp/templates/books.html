{% extends "base.html" %}

{% block title %}
Κατάλογος
{% endblock title %}

{% block content %}

<div style="width: 85%; padding-right: 15px; padding-left: 15px; margin-right: auto; margin-left: auto;">
  <div class="py-5 text-center">
    <img src="{{url_for('static', filename = 'images/books.png')}}" width="64">
    <h2>Κατάλογος</h2>
  </div>
  <div class="table-responsive">
    <table class="table table-striped table-sm">
      <thead>
        <tr>
          <th style="width: 35%">Τίτλος</th>
          <th style="width: 30%">Συγγραφέας</th>
          <th style="width: 20%">Εκδότης</th>
          <th style="width: 15%">Τοποθεσία</th>
        </tr>
      </thead>
      <tbody>
        {% for b in books %}
        <tr>
          <td>{{b.title}}</td>
          <td>{{b.authors}}</td>
          <td>{{b.name}}</td>
          <td>{{b.place}}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

</div>

{% endblock %}
