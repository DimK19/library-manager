{% extends "base.html" %}

{% block title %}
Αναζήτηση
{% endblock %}

{% block content %}

<div class="container">
  <div class="py-5 text-center">
    <img src="{{url_for('static', filename = 'images/open-book.png')}}" width="64">
    <h2>Αναζήτηση βιβλίου</h2>
    <p class="lead"></p>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-8">
      <form id="searchForm" method="POST" action="{{url_for('book.search_book')}}">

        <div class="mb-3">
          <label for="title"><h4>Τίτλος</h4></label>
          <input type="text" class="form-control required" name="searchTitle" id="searchTitle">
          <div class="invalid-feedback">
            Απαιτούμενο πεδίο.
          </div>
          <br>
        </div>
      </form>
      <button id="submitByTitle" class="btn btn-secondary btn-lg btn-block">Αναζήτηση</button>
      <hr>
    </div>
  </div>

  {% if books %}

  {% include "table.html" %}

  {% endif %}
</div>

<script src="/static/js/script_search_by_title.js"></script>

{% endblock %}
