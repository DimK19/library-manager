{% extends "base.html" %}

{% block title %}
Διόρθωση συγγραφέως
{% endblock %}

{% block content %}

<div class="container">
  <div class="py-5 text-center">
    <img src="{{url_for('static', filename = 'images/fountain-pen.png')}}" width="64">
    <h2>Αναζήτηση συγγραφέως</h2>
    <p class="lead"></p>
  </div>

  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="mb-3">
        <select class="form-control form-select d-block w-100 required" name="authorSelect" id="authorSelect">
          <option value="" selected disabled>Αναζήτηση</option>
          {% for a in authors %}
          <option value="{'id': '{{a.id}}', 'firstName': '{{a.first_name}}', 'lastName': '{{a.last_name}}'}">{{a.last_name}}{% if a.first_name != 'NULL' %}, {{a.first_name}}{% endif %}</option>
          {% endfor %}
        </select>
        <br>
      </div>
      <button id="submitAuthorName" class="btn btn-secondary btn-lg btn-block">Επιλογή</button>
      <hr>
      </div>

    <div id="editFormArea" class="col-md-8" style="display: none;">
      <form id="editAuthorForm" action="{{url_for('edit_author')}}" method="POST">
        <div class="mb-3" id="editAuthor">
          <h4>Διόρθωση στοιχείων</h4>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="authorFirstName">Όνομα</label>
              <input type="text" class="form-control" name="authorFirstName" id="authorFirstName">
              <div class="invalid-feedback">
                Valid first name is required.
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="authorLastName">Επώνυμο</label>
              <input type="text" class="form-control" name="authorLastName" id="authorLastName">
              <div class="invalid-feedback">
                Απαιτούμενο πεδίο.
              </div>
            </div>
          </div>
        </div>
        <input type="hidden" name="authorId" id="authorId" value="">
      </form>
      <button id="submitEditAuthor" class="btn btn-primary btn-lg btn-block">Διόρθωση</button>
    </div>
  </div>
</div>

<script src="/static/js/script_edit_author.js"></script>

{% endblock %}
