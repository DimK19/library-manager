{% extends "base.html" %}

{% block title %}
Διόρθωση Συλλογής
{% endblock %}

{% block content %}

<div class="container">
  <div class="py-5 text-center">
    <img src="{{url_for('static', filename = 'images/fountain-pen.png')}}" width="64">
    <h2>Αναζήτηση συλλογής</h2>
    <p class="lead"></p>
  </div>
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="mb-3">
        <select class="form-control form-select d-block w-100 required" name="collectionSelect" id="collectionSelect">
          <option value="" selected disabled>Αναζήτηση</option>
          {% for p in collections %}
          <option value="{'id': '{{p.id}}', 'title': '{{p.title}}', 'type_id': '{{p.collection_type_id}}'}">{{p.title}}</option>
          {% endfor %}
        </select>
        <br>
      </div>
      <button id="submitCollectionName" class="btn btn-secondary btn-lg btn-block">Επιλογή</button>
      <hr>
    </div>

    <div id="editFormArea" class="col-md-8" style="display: none;">
      <form id="editCollectionForm" action="{{url_for('collection.update_collection')}}" method="POST">
        <div class="mb-3" id="editCollection">
          <h4>Διόρθωση στοιχείων</h4>
          <div class="mb-3">
            <div class="row">
              <div class="col-md-5 mb-3">
                <label for="cc-name">Είδος</label>
                <select class="form-control d-block w-100" name="collectionType" id="collectionType">
                  <option value="" disabled></option>
                  {% for ct in collection_types %}
                  <option value="{{ct.id}}">{{ct.category}}</option>
                  {% endfor %}
                </select>
                <div class="invalid-feedback">
                  Απαιτούμενο πεδίο.
                </div>
              </div>
              <div class="col-md-7 mb-3">
                <label for="cc-number">Όνομα σειράς</label>
                <input type="text" class="form-control" id="collectionName" name="collectionName">
                <div class="invalid-feedback">
                  Απαιτούμενο πεδίο.
                </div>
              </div>
            </div>
            <br>
          </div>
        </div>
        <input type="hidden" name="collectionId" id="collectionId" value="">
      </form>
      <button id="submitEditCollection" class="btn btn-primary btn-lg btn-block">Διόρθωση</button>
    </div>
  </div>
</div>

<script src="/static/js/script_edit_collection.js"></script>

{% endblock %}
